# Headless Service (gives the StatefulSet pod a stable DNS name)

apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: app
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379

---
# ClusterIP Service (what the backend connects to: redis://redis:6379/0)

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: app
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: app
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379

        volumeMounts:
        - name: data
          mountPath: /data

        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 256Mi

        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 20

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
