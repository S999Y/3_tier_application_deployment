apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: django-configmap
  namespace: app
data:
  POSTGRES_HOST: "postgres.db-production.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"
  RESULT_CACHE_TTL: "300"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:8000,http://localhost:3000,http://129.212.245.100.nip.io"


---
apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: app
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600 
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: registry.digitalocean.com/roy909/backend:1.0
        imagePullPolicy: IfNotPresent
        args: ["echo", "Migrations done."]  
        env:
        - name: RUN_MIGRATIONS
          value: "true"
        envFrom:
        - configMapRef:
            name: django-configmap
        - secretRef:
            name: backend-secret

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: registry.digitalocean.com/roy909/backend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: RUN_MIGRATIONS
          value: "false"        
        envFrom:
        - configMapRef:
            name: django-configmap
        - secretRef:
            name: backend-secret

        resources:
          requests:
            cpu: 50m
            memory: 180Mi
          limits:
            memory: 300Mi

        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
