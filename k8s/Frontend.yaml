apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend  # real image and tag are set in kustomization.yaml
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        # nginx's resolver does not use search domains, so use the full name.
        - name: BACKEND_URL
          value: "backend.app.svc.cluster.local:8000"
        # kube-dns Service IP (kubectl get svc -n kube-system kube-dns)
        - name: NGINX_RESOLVER
          value: "10.109.0.10"

        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
