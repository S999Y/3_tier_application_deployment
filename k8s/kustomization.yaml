apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Database.yaml
  - Redis.yaml
  - Backend.yaml
  - Frontend.yaml
  - Ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: backend-secret
    namespace: app
    envs:
      - backend.env
  - name: postgres-secret
    namespace: db-production
    envs:
      - postgres.env

# Docker Desktop deployment: images are published to the local registry.
# Start it first with scripts/deploy.sh (or: docker run -d -p 5000:5000
# --restart=always --name registry registry:2).
images:
  - name: backend
    newName: localhost:5000/result-backend
    newTag: latest
  - name: frontend
    newName: localhost:5000/result-frontend
    newTag: latest
